<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="진표와 진서">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1d1a3a">
<meta name="robots" content="noindex, nofollow">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="favicon.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html,body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>진표와 진서의 모험</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap">
<style>
  :root {
    --ink: #1d1a3a;
    --ink-deep: #110f26;
    --sun: #ffc83d;
    --sun-deep: #e0931a;
    --leaf: #2e9e4f;
    --berry: #e4466b;
    --paper: #fff7e3;
    --sky: #5ec8f2;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body {
    background: radial-gradient(120% 90% at 50% 0%, #2a2560 0%, var(--ink) 55%, var(--ink-deep) 100%);
    color: #fff;
    font-family: "Jua", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
    touch-action: none;
  }
  #app {
    position: relative;
    height: 100%;
    padding-inline: 16px;
    box-sizing: border-box;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #stage {
    position: relative;
    container-type: size;
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 0 0 3px var(--ink-deep), 0 14px 40px rgba(0,0,0,.45);
    background: #5ec8f2;
  }
  #game { display: block; width: 100%; height: 100%; }

  /* HUD */
  #hud {
    position: absolute; inset: 0 0 auto 0;
    display: flex; align-items: center; gap: clamp(8px, 3cqw, 26px);
    padding: clamp(4px, 2cqh, 12px) clamp(8px, 2.4cqw, 18px);
    font-size: clamp(12px, 5cqh, 24px);
    line-height: 1;
    color: #fff;
    text-shadow: 0 2px 0 var(--ink), 2px 0 0 var(--ink), -2px 0 0 var(--ink), 0 -2px 0 var(--ink);
    pointer-events: none;
    font-variant-numeric: tabular-nums;
  }
  .hud-item { display: flex; align-items: center; gap: .3em; white-space: nowrap; }
  .hud-item img { height: 1.25em; image-rendering: pixelated; filter: drop-shadow(0 2px 0 var(--ink)); }
  .coin-dot {
    width: 1.05em; height: 1.05em;
    background: linear-gradient(#ffe98a, #f4a51f);
    clip-path: polygon(50% 0, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
  }
  .hud-label { opacity: .85; font-size: .7em; }
  .coin-dot.big { width: 1.35em; height: 1.35em; background: linear-gradient(135deg, #ff7ab8, #ffd23f 45%, #6fd6ff); }
  #hudWorld { margin-left: auto; font-size: .8em; }
  #hudPow { background: rgba(255,228,92,.95); color: var(--ink); text-shadow: none; padding: .25em .7em .2em; border-radius: 999px; border: 2px solid var(--ink); font-size: .8em; }
  .hud-btns { display: flex; gap: 6px; pointer-events: auto; }
  .icon-btn {
    width: clamp(28px, 9cqh, 40px); height: clamp(28px, 9cqh, 40px);
    display: grid; place-items: center;
    border-radius: 10px; border: 2px solid var(--ink);
    background: rgba(255,247,227,.92); color: var(--ink);
    box-shadow: 0 3px 0 var(--ink);
    cursor: pointer; padding: 0;
  }
  .icon-btn svg { width: 58%; height: 58%; }
  .icon-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--ink); }
  .icon-btn:focus-visible, .btn:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }

  /* Overlays */
  .overlay {
    position: absolute; inset: 0;
    display: grid; place-items: center;
    padding: 4cqh 4cqw;
    box-sizing: border-box;
    text-align: center;
  }
  .overlay.dim { background: rgba(17,15,38,.62); }
  .overlay.title { background: linear-gradient(180deg, rgba(17,15,38,.15) 0%, rgba(17,15,38,.05) 45%, rgba(17,15,38,.45) 100%); }
  .stack { display: grid; justify-items: center; gap: clamp(6px, 3cqh, 18px); }
  .kicker {
    font-size: clamp(12px, 4.4cqh, 22px);
    background: var(--berry); color: #fff;
    padding: .3em .9em .25em; border-radius: 999px;
    border: 2px solid var(--ink); box-shadow: 0 3px 0 var(--ink);
    transform: rotate(-2deg);
  }
  h1.logo {
    margin: 0;
    font-weight: 400;
    font-size: clamp(34px, 17cqh, 110px);
    line-height: .95;
    color: var(--sun);
    -webkit-text-stroke: clamp(4px, 1.6cqh, 10px) var(--ink);
    paint-order: stroke fill;
    text-shadow: 0 clamp(3px, 1.4cqh, 8px) 0 var(--ink);
    letter-spacing: .02em;
    text-wrap: balance;
  }
  h1.logo .big { display: block; font-size: 1.28em; color: #fff; }
  h1.logo .big span { color: var(--sun); }
  .lede {
    margin: 0; max-width: 30em;
    font-size: clamp(12px, 4.4cqh, 21px);
    color: #fff;
    text-shadow: 0 2px 0 var(--ink);
  }
  .row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  .btn {
    font-family: inherit;
    font-size: clamp(14px, 5.6cqh, 28px);
    padding: .45em 1.2em .38em;
    border-radius: 16px;
    border: 3px solid var(--ink);
    background: var(--sun); color: var(--ink);
    box-shadow: 0 5px 0 var(--ink);
    cursor: pointer;
  }
  .btn:hover { background: #ffd764; }
  .btn:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--ink); }
  .btn.ghost { background: var(--paper); }
  .keys {
    font-size: clamp(10px, 3.4cqh, 16px);
    color: var(--paper); opacity: .9;
    text-shadow: 0 2px 0 var(--ink);
  }
  kbd {
    font-family: inherit; display: inline-block;
    background: var(--paper); color: var(--ink);
    border-radius: 6px; padding: .1em .45em; margin: 0 .1em;
    box-shadow: 0 2px 0 var(--ink);
  }
  .pick {
    font-family: inherit; cursor: pointer;
    display: grid; justify-items: center; gap: .2em;
    padding: .5em 1.1em .45em;
    font-size: clamp(16px, 6cqh, 30px); color: var(--ink);
    background: var(--paper);
    border: 3px solid var(--ink); border-radius: 18px;
    box-shadow: 0 5px 0 var(--ink);
  }
  .pick img { height: clamp(64px, 30cqh, 180px); image-rendering: pixelated; }
  .pick.last { background: var(--sun); }
  .pick:hover { transform: translateY(-2px); }
  .pick:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--ink); }
  .pick:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
  .linkish { font: inherit; color: var(--sun); background: none; border: 0; padding: 0; text-decoration: underline; cursor: pointer; }
  img.photo { image-rendering: auto; aspect-ratio: 1; object-fit: contain; filter: drop-shadow(0 2px 0 var(--ink)); }
  .hud-item img.photo { height: 2.4em; margin-block: -.5em; }
  img.duo { height: clamp(56px, 24cqh, 140px); image-rendering: pixelated; }
  .card {
    background: var(--paper); color: var(--ink);
    border: 3px solid var(--ink); border-radius: 20px;
    box-shadow: 0 8px 0 var(--ink);
    padding: clamp(12px, 5cqh, 30px) clamp(18px, 6cqw, 48px);
    display: grid; justify-items: center; gap: clamp(4px, 2cqh, 12px);
    max-width: 90cqw;
  }
  .card .eyebrow { font-size: clamp(12px, 4.4cqh, 22px); color: var(--berry); letter-spacing: .08em; }
  .card .name { font-size: clamp(22px, 11cqh, 60px); line-height: 1; text-wrap: balance; }
  .card .meta { display: flex; align-items: center; gap: .4em; font-size: clamp(14px, 5.4cqh, 28px); }
  .card .meta img { height: 2.4em; image-rendering: pixelated; }
  .card p { margin: 0; font-size: clamp(12px, 4.4cqh, 21px); max-width: 26em; text-wrap: balance; }
  .card h2 { margin: 0; font-weight: 400; font-size: clamp(24px, 11cqh, 58px); line-height: 1; color: var(--berry); }

  /* Touch controls (태블릿) */
  html, body { overscroll-behavior: none; }
  body.touch { position: fixed; inset: 0; }
  body.touch #app { padding: 0; }
  body.touch #stage { border-radius: 0; box-shadow: none; }
  body.touch .icon-btn { width: 54px; height: 54px; border-radius: 16px; }
  body.touch #hud { padding: calc(10px + env(safe-area-inset-top, 0px)) calc(14px + env(safe-area-inset-right, 0px)) 10px calc(14px + env(safe-area-inset-left, 0px)); font-size: clamp(18px, 4.6cqh, 30px); }
  #hud { z-index: 6; }
  #minimap {
    position: absolute; right: clamp(8px, 2.4cqw, 18px); top: calc(100% + 4px);
    width: min(42cqw, 400px); height: clamp(24px, 7.5cqh, 42px);
    pointer-events: none;
  }
  #mmCanvas { display: block; width: 100%; height: 100%; border-radius: 999px; box-shadow: 0 0 0 2px var(--ink), 0 3px 0 2px var(--ink); }
  #mmMe { position: absolute; top: 50%; left: 0; height: 170%; aspect-ratio: 1; transform: translate(-50%, -60%); filter: drop-shadow(0 2px 0 var(--ink)); }
  #overlay { z-index: 7; }
  #touch { position: absolute; inset: 0; display: none; pointer-events: none; z-index: 5; }
  body.touch.playing #touch { display: block; }
  #zoneL, #zoneR {
    position: absolute; bottom: 0; height: 74%;
    display: flex; align-items: flex-end;
    pointer-events: auto; touch-action: none;
    padding-bottom: calc(22px + env(safe-area-inset-bottom, 0px));
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }
  #zoneL { left: 0; width: 48%; justify-content: flex-start; padding-left: calc(22px + env(safe-area-inset-left, 0px)); }
  #zoneR { right: 0; width: 52%; justify-content: flex-end; padding-right: calc(26px + env(safe-area-inset-right, 0px)); }
  #dpad { display: flex; gap: 16px; pointer-events: none; }
  .pad-btn, #jumpBtn {
    display: grid; place-items: center;
    color: #fff;
    background: rgba(29,26,58,.28);
    border: 3px solid rgba(255,255,255,.85);
    box-shadow: 0 6px 0 rgba(29,26,58,.35);
    backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
    transition: transform .06s, background .06s;
  }
  .pad-btn { width: clamp(84px, 13vw, 124px); height: clamp(84px, 13vw, 124px); border-radius: 30px; }
  .pad-btn svg { width: 46%; height: 46%; filter: drop-shadow(0 2px 0 rgba(29,26,58,.5)); }
  #jumpBtn {
    width: clamp(108px, 17vw, 160px); height: clamp(108px, 17vw, 160px); border-radius: 50%;
    background: rgba(228,70,107,.62);
    font-size: clamp(18px, 3vw, 28px); line-height: 1;
    text-shadow: 0 2px 0 var(--ink);
    align-content: center; gap: 2px;
  }
  #jumpBtn svg { width: 40%; height: 40%; }
  .pad-btn.on, #jumpBtn.on { transform: translateY(4px) scale(.96); box-shadow: 0 2px 0 rgba(29,26,58,.35); background: rgba(255,200,61,.8); }
  .hint {
    position: absolute; bottom: calc(100% + 10px); left: 50%; transform: translateX(-50%);
    white-space: nowrap; font-size: clamp(14px, 2.2vw, 20px); color: #fff; text-shadow: 0 2px 0 var(--ink);
    transition: opacity .6s;
  }
  body.hinted .hint { opacity: 0; }
  #dpad, #jumpBtn { position: relative; }
  #rotate {
    position: fixed; inset: 0; z-index: 20;
    display: grid; place-items: center; padding: 24px;
    background: rgba(17,15,38,.88);
  }
  .rot-icon { width: 84px; height: 84px; animation: tilt 1.8s ease-in-out infinite; }
  @keyframes tilt { 0%, 30% { transform: rotate(0); } 60%, 100% { transform: rotate(-90deg); } }
  .chip {
    font-family: inherit; cursor: pointer;
    font-size: clamp(13px, 4.2cqh, 22px);
    padding: .45em 1em .38em; border-radius: 999px;
    border: 3px solid var(--ink); box-shadow: 0 3px 0 var(--ink);
    background: #c9f2d4; color: var(--ink);
  }
  .chip.off { background: var(--paper); }
  @media (hover: none) { .pick:hover, .btn:hover { transform: none; } }
  @media (prefers-reduced-motion: reduce) {
    .btn:active, .icon-btn:active { transform: none; }
    .rot-icon { animation: none; }
  }
</style>

</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="game" aria-label="진표와 진서의 모험 게임 화면"></canvas>
    <div id="hud" hidden>
      <div class="hud-item"><img id="hudFace" alt=""><span id="hudLives">×5</span></div>
      <div class="hud-item"><span class="coin-dot"></span><span id="hudCoins">×00</span></div>
      <div class="hud-item" id="hudBig"><span class="coin-dot big"></span><span id="hudBigN">0/0</span></div>
      <div class="hud-item"><span class="hud-label">점수</span><span id="hudScore">000000</span></div>
      <div class="hud-item" id="hudPow" hidden></div>
      <div class="hud-item" id="hudWorld">1. 진표의 동네</div>
      <div id="minimap"><canvas id="mmCanvas" width="640" height="64"></canvas><img id="mmMe" alt=""></div>
      <div class="hud-btns">
        <button class="icon-btn" id="btnSound" aria-label="소리 끄기/켜기"></button>
        <button class="icon-btn" id="btnPause" aria-label="잠깐 멈추기">
          <svg viewBox="0 0 20 20"><rect x="4" y="3" width="4" height="14" rx="1" fill="currentColor"/><rect x="12" y="3" width="4" height="14" rx="1" fill="currentColor"/></svg>
        </button>
      </div>
    </div>
    <div id="overlay" class="overlay" hidden></div>
  </div>
  <div id="touch">
    <div id="zoneL">
      <div id="dpad">
        <div class="hint">여기를 눌러 이동</div>
        <div class="pad-btn" data-dir="left"><svg viewBox="0 0 20 20"><path d="M13.5 3.5 L5.5 10 L13.5 16.5 Z" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg></div>
        <div class="pad-btn" data-dir="right"><svg viewBox="0 0 20 20"><path d="M6.5 3.5 L14.5 10 L6.5 16.5 Z" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg></div>
      </div>
    </div>
    <div id="zoneR">
      <div id="jumpBtn">
        <div class="hint">여기를 눌러 점프</div>
        <svg viewBox="0 0 20 20"><path d="M10 3 L17 12 H3 Z" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg><span>점프</span>
      </div>
    </div>
  </div>
  <div id="rotate" hidden>
    <div class="card">
      <svg class="rot-icon" viewBox="0 0 48 48"><rect x="12" y="4" width="24" height="40" rx="5" fill="none" stroke="#1d1a3a" stroke-width="3.5"/><circle cx="24" cy="38" r="2" fill="#1d1a3a"/></svg>
      <div class="name">가로로 돌려 주세요</div>
      <p>태블릿을 옆으로 눕히면 화면이 크게 보여요.</p>
      <button class="btn ghost" id="rotateOk">그냥 이대로 할게요</button>
    </div>
  </div>
</div>

/* 스테이지: 처음·끝은 원래 길, 가운데 3구간은 놀이 구간을 섞어서 만들어요 */
const REPS = 5;
const PW_ROT = ['bunny', 'wings', 'tiger', 'dino', 'rainbow', 'magnet', 'milk'];
const GEN_SEGS = 3, GEN_LEN = 190;
function build(seg, fn, seed) {
  let w = seg * 2 + GEN_SEGS * (GEN_LEN + 50) + 20;
  const grid = Array.from({ length: ROWS }, () => Array(w).fill(' '));
  const L = { w, seg, g: grid, ents: [], flagX: 0, castleX: 0, cps: [] };
  const set = (x, y, c) => { if (x >= 0 && x < w && y >= 0 && y < ROWS) grid[y][x] = c; };
  const mk = (dx, k) => {
    const X = x => x + dx;
    const b = {
      ground: (a, z) => { for (let x = X(a); x <= X(z); x++) { set(x, 13, 'G'); set(x, 14, 'D'); } },
      row: (a, z, y, c) => { for (let x = X(a); x <= X(z); x++) set(x, y, c); },
      t: (x, y, c) => set(X(x), y, c),
      coins: (a, z, y) => { for (let x = X(a); x <= X(z); x++) set(x, y, 'o'); },
      pipe: (x, h) => { const top = 13 - h; x = X(x); set(x, top, '['); set(x + 1, top, ']'); for (let y = top + 1; y < 13; y++) { set(x, y, '{'); set(x + 1, y, '}'); } },
      col: (x, h) => { for (let j = 0; j < h; j++) set(X(x), 12 - j, 'X'); },
      up: (x, n) => { for (let i = 0; i < n; i++) b.col(x + i, i + 1); },
      down: (x, n) => { for (let i = 0; i < n; i++) b.col(x + i, n - i); },
      en: (x, ty = 12) => L.ents.push({ k: 'walker', tx: X(x), ty }),
      bee: (x, ty) => L.ents.push({ k: 'bee', tx: X(x), ty }),
      cp: x => L.cps.push(X(x)),
      pw: (x, ty, kind) => L.ents.push({ k: 'pw', tx: X(x), ty, kind: PW_ROT[(PW_ROT.indexOf(kind) + k * 2) % PW_ROT.length] }),
      boost: x => set(X(x), 12, '>'),
      flag: x => { if (k === REPS - 1) L.flagX = X(x); },
      castle: x => { if (k === REPS - 1) L.castleX = X(x); },
      frog: (x, ty = 12) => L.ents.push({ k: 'frog', tx: X(x), ty }),
      mplat: (x, ty, axis, range) => L.ents.push({ k: 'mplat', tx: X(x), ty, axis, range }),
      big: (x, ty) => L.ents.push({ k: 'big', tx: X(x), ty }),
    };
    return b;
  };
  const rng = mulberry(seed * 977 + 13), keys = Object.keys(CHUNKS);
  fn(mk(0, 0));
  let x = seg, last = '';
  for (let m = 1; m <= GEN_SEGS; m++) {
    L.cps.push(x + 2);
    mk(x, m).ground(0, 9); [9, 8, 7, 8, 9].forEach((y, i) => set(x + 3 + i, y, 'o'));
    const start = x; x += 10;
    while (x - start < GEN_LEN) {
      let key; do { key = pick(rng, keys); } while (key === last); last = key;
      x += CHUNKS[key](mk(x, m), rng);
    }
  }
  L.cps.push(x + 2);
  [9, 8, 7, 8, 9].forEach((y, i) => set(x + 12 + i, y, 'o'));
  fn(mk(x, REPS - 1));
  w = x + seg + 12; L.w = w;
  for (let y = 0; y < ROWS; y++) grid[y].length = w;
  L.cps.sort((a, c) => a - c);
  // 도착 건물 뒤로 땅을 끝까지 이어요 (기다리는 형제 자리)
  for (let x = L.castleX; x < w; x++) { grid[13][x] = 'G'; grid[14][x] = 'D'; }
  // 공중 블록 올리기: 9줄 → 8줄, 5줄 이상 높은 블록 → 2줄 위
  const moved = [];
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < w; x++) {
    const c = grid[y][x];
    if ('B?MU'.includes(c) && y <= 9) { moved.push([x, y <= 5 ? y - 2 : y - 1, c]); grid[y][x] = ' '; }
  }
  for (const [x, y, c] of moved) if (y >= 0) grid[y][x] = c;
  return L;
}

/* ---------- Physics ---------- */
function moveX(b) {
  b.x += b.vx; b.hitWall = 0;
  const t0 = Math.floor(b.y / T), t1 = Math.floor((b.y + b.h - 0.01) / T);
  if (b.vx > 0) {
    const tx = Math.floor((b.x + b.w - 0.01) / T);
    for (let ty = t0; ty <= t1; ty++) if (SOLID.has(tile(tx, ty))) { b.x = tx * T - b.w; b.vx = 0; b.hitWall = 1; break; }
  } else if (b.vx < 0) {
    const tx = Math.floor(b.x / T);
    for (let ty = t0; ty <= t1; ty++) if (SOLID.has(tile(tx, ty))) { b.x = (tx + 1) * T; b.vx = 0; b.hitWall = -1; break; }
  }
}
function moveY(b, isPlayer) {
  const prevBottom = b.y + b.h;
  b.y += b.vy; b.onGround = false;
  const l = Math.floor(b.x / T), r = Math.floor((b.x + b.w - 0.01) / T);
  if (b.vy > 0) {
    const ty = Math.floor((b.y + b.h - 0.01) / T);
    for (let tx = l; tx <= r; tx++) {
      const c = tile(tx, ty);
      if (SOLID.has(c) || (ONEWAY.has(c) && prevBottom <= ty * T + 0.5)) {
        b.y = ty * T - b.h; b.vy = 0; b.onGround = true; return null;
      }
    }
  } else if (b.vy < 0) {
    const ty = Math.floor(b.y / T); const hits = [];
    for (let tx = l; tx <= r; tx++) if (SOLID.has(tile(tx, ty))) hits.push(tx);
    if (hits.length) {
      if (isPlayer && hits.length === 1) {
        const left = hits[0] * T, right = left + T;
        if (b.x < left && b.x + b.w - left <= 5 && !SOLID.has(tile(hits[0] - 1, ty))) { b.x = left - b.w; return null; }
        if (b.x + b.w > right && right - b.x <= 5 && !SOLID.has(tile(hits[0] + 1, ty))) { b.x = right; return null; }
      }
      b.y = (ty + 1) * T; b.vy = 0;
      return { ty, hits };
    }
  }
  return null;
}

/* ---------- Update ---------- */
function updatePlayer() {
  const p = P;
  const left = kb.left || tc.left, right = kb.right || tc.right, jumpHeld = kb.jump || tc.jump;
  const dir = (right ? 1 : 0) - (left ? 1 : 0);
  // 변신 시간
  if (p.formT > 0 && --p.formT === 0) endForm();
  if (p.rainbowT > 0) p.rainbowT--;
  if (p.magnetT > 0) p.magnetT--;
  if (p.padT > 0) p.padT--;
  // 계속 누르면 점점 빨라져요 (로켓 달리기)
  const base = (p.form === 'tiger' ? 3.4 : (easy ? 2.4 : 2.6)) + (kb.run ? 0.8 : 0);
  if (dir && Math.sign(p.vx) === dir && Math.abs(p.vx) >= base * 0.85) p.run = Math.min(p.run + 1, 160);
  else if (!dir || Math.sign(p.vx) !== dir) p.run = Math.max(0, p.run - 6);
  const boostK = p.padT > 0 ? 1 : clamp((p.run - 35) / 70, 0, 1);

function drawTiles(cx) {
  const vx0 = Math.max(0, Math.floor(cx / T) - 1), vx1 = Math.min(L.w - 1, Math.ceil((cx + bw) / T) + 1);
  for (let tx = vx0; tx <= vx1; tx++) {
    if (L.g[13][tx] === 'G' && (tx === vx0 || L.g[13][tx - 1] !== 'G')) {
      let a = tx; while (a > 0 && L.g[13][a - 1] === 'G') a--;
      let b = tx; while (b < L.w - 1 && L.g[13][b + 1] === 'G') b++;
      drawGroundRun(a, b, vx0, vx1);
    }
  }
  for (let ty = 0; ty < ROWS; ty++) {
    for (let tx = vx0; tx <= vx1; tx++) {
      const c = L.g[ty][tx];
      if ((c === '-' || c === 'C') && (tx === vx0 || !ONEWAY.has(L.g[ty][tx - 1]))) {
        let a = tx; while (a > 0 && ONEWAY.has(L.g[ty][a - 1])) a--;
        let b = tx; while (b < L.w - 1 && ONEWAY.has(L.g[ty][b + 1])) b++;
        drawPlatRun(a, b, ty);
      }
    }
  }
  for (let ty = 0; ty < ROWS; ty++) for (let tx = vx0; tx <= vx1; tx++) {
    const c = L.g[ty][tx];
    if (c === ' ' || c === 'G' || c === 'D' || c === '-' || c === 'C' || c === ']' || c === '{' || c === '}') continue;
    const bk = bumps.get(tx + ',' + ty);
    const off = bk != null && c !== 'T' ? Math.sin((bk / 10) * Math.PI) * 5 : 0;
    const x = tx * T, y = ty * T - off;
    switch (c) {
      case '?': case 'M': giftBox(x, y, tx, false); break;
      case 'U': giftBox(x, y, tx, true); break;
      case 'B': drawBrickTile(x, y, tx); break;
      case 'X': drawBlockTile(x, y, tx, ty); break;
      case '[': planter(tx, ty); break;
      case 'T': trampoline(x, y, bk); break;
      case '>': boostPad(x, ty * T, bk); break;
      case 'o': starCoin(x + 8, y + 8, frame + tx * 11); break;
    }
  }
}

/* --- characters --- */
const OUTFIT = {
  jinpyo: { top: '#1f2a55', sleeve: '#c9ccd4', pants: '#c7cad3', pantsDark: '#aeb2bd', shoe: '#17171f', arc: '#f2b632', shortSleeve: false, stripe: null },

const SKIN = '#ffd3ad';

function drawKid(ck, st) {
  const o = OUTFIT[ck], fx = st.x + st.w / 2, fy = st.y + st.h, D = 46;
  if (!st.air && !st.dead && !st.ghost) ell(fx, fy + 0.3, 17, 2.8, 'rgba(20,20,60,.18)');
  g.save(); g.translate(fx, fy);
  if (st.dead) { g.translate(0, -24); g.rotate(Math.PI * 0.9); g.translate(0, 24); }
  if (st.spin > 0) { g.translate(0, -40); g.rotate((1 - st.spin) * TAU * st.dir); g.translate(0, 40); }
  const sq = st.squash || 0;
  g.scale(st.dir * (1 + sq * 0.12), 1 - sq * 0.12);
  // 무지개 오라
  if (st.rainbow) {
    const hue = (frame * 9) % 360;
    g.fillStyle = rad(0, -40, 52, `hsla(${hue},95%,65%,.55)`, `hsla(${(hue + 120) % 360},95%,65%,0)`);
    g.fillRect(-54, -94, 108, 108);
  }
  const moving = Math.abs(st.speed) > 0.3 && !st.air;
  const sw = moving ? Math.sin(st.walk) * (st.boost > 0.5 ? 1.1 : 0.75) : 0;
  const breathe = moving || st.air ? 0 : Math.sin(frame * 0.08) * 0.25;
  let legF = sw, legB = -sw, armF = -sw * 0.9, armB = sw * 0.9;
  if (st.air) { legF = 0.55; legB = -0.45; armF = -2.5; armB = -2.1; }
  if (st.boost > 0.5 && !st.air) { armF = 1.3; armB = 1.1; } // 로켓 자세: 팔을 뒤로
  if (st.cheer) { armF = -2.8; armB = -2.6; }
  const BX = 2.6, BY = 2.1;
  g.save(); g.scale(BX, BY);
  // 날개 (몸 뒤)
  if (st.form === 'wings') {
    const flap = st.air ? Math.sin(frame * 0.5) * 0.6 : 0.15;
    for (const side of [1, 0.75]) {
      g.save(); g.translate(-3, -12); g.rotate(-0.9 - flap * side);
      g.globalAlpha = side === 1 ? 1 : 0.8;
      ell(-9, 0, 11, 5, '#ffffff'); ell(-13, 3, 8, 3.5, '#d7f0ff'); ell(-16, 5.5, 5, 2.4, '#b8e3ff');
      g.globalAlpha = 1; g.restore();
    }
  }
  // 호랑이 꼬리 / 공룡 꼬리 (몸 뒤)
  if (st.form === 'tiger') {
    g.strokeStyle = '#ff9f1c'; g.lineWidth = 3; g.lineCap = 'round';
    const wag = Math.sin(frame * 0.2) * 3;
    g.beginPath(); g.moveTo(-4, -7); g.quadraticCurveTo(-14, -6, -15, -16 + wag); g.stroke();
    g.strokeStyle = '#2b1d12'; g.lineWidth = 3.2; g.setLineDash([1.5, 3]); g.stroke(); g.setLineDash([]);
  }
  if (st.form === 'dino') {
    g.fillStyle = '#3fbf6a'; g.beginPath(); g.moveTo(-3, -12); g.quadraticCurveTo(-16, -8, -20, -1); g.quadraticCurveTo(-12, -3, -3, -5); g.closePath(); g.fill();
    g.fillStyle = '#ffd23f'; for (const [x, y] of [[-8, -11], [-13, -8.5], [-17, -5]]) { g.beginPath(); g.moveTo(x - 2, y + 1.5); g.lineTo(x, y - 2.5); g.lineTo(x + 2, y + 1.5); g.closePath(); g.fill(); }
  }
  kidLeg(o, -1.9, legB, true);
  kidArm(o, -4.2, armB, true);
  kidLeg(o, 1.9, legF, false);
  g.translate(0, breathe);
  const top = st.form === 'tiger' ? '#ff9f1c' : st.form === 'dino' ? '#3fbf6a' : o.top;
  fillRR(-5.2, -14, 10.4, 9, [3.5, 3.5, 2.5, 2.5], top);
  if (st.form === 'tiger') { g.fillStyle = '#2b1d12'; for (const x of [-3, 0, 3]) g.fillRect(x - 0.5, -13, 1.1, 4); }
  else if (st.form === 'dino') { fillRR(-3, -11, 6, 5, 2, '#b6f0c4'); }
  else {
    if (!o.shortSleeve) { fillRR(-5.2, -14, 3.4, 5, [3, 0, 0, 1], o.sleeve); fillRR(1.8, -14, 3.4, 5, [0, 3, 1, 0], o.sleeve); }
    if (o.arc) { g.strokeStyle = o.arc; g.lineWidth = 0.9; g.beginPath(); g.arc(0, -7, 3.4, Math.PI * 1.18, Math.PI * 1.82); g.stroke(); }
    else { g.fillStyle = 'rgba(255,255,255,.35)'; g.fillRect(-3.5, -12.5, 7, 0.8); }
  }
  fillRR(-1.4, -15.6, 2.8, 2.4, 1, SKIN);
  kidArm(o, 4.2, armF, false);
  g.restore();
  // 머리
  const tilt = st.air ? -0.08 : Math.sin(st.walk) * (moving ? 0.07 : 0.03);
  g.save(); g.translate(0, -14.5 * BY + breathe * BY); g.rotate(tilt + (st.boost > 0.5 && !st.air ? 0.12 : 0));
  const hy = -D + 4; // 머리 이미지 위쪽 (머리가 몸 위에 올라가요)
  // 머리 뒤 장식 (토끼 귀, 호랑이 귀, 공룡 가시)
  if (st.form === 'bunny') {
    const flop = Math.sin(frame * 0.15) * 0.08;
    for (const s of [-1, 1]) {
      g.save(); g.translate(s * 9, hy + 10); g.rotate(s * 0.18 + flop * s);
      ell(0, -14, 5.5, 15, '#ffffff'); ell(0, -13, 2.8, 11, '#ffb3c8');
      g.restore();
    }
  } else if (st.form === 'tiger') {
    for (const s of [-1, 1]) { circle(s * 19, hy + 12, 7.5, '#ff9f1c'); circle(s * 19, hy + 12, 3.8, '#2b1d12'); }
  } else if (st.form === 'dino') {
    for (let k = 0; k < 7; k++) {
      const a = Math.PI + 0.35 + k * (Math.PI - 0.7) / 6, r = 25;
      const x = Math.cos(a) * r, y = hy + 28 + Math.sin(a) * r;
      g.save(); g.translate(x, y); g.rotate(a + Math.PI / 2);
      g.fillStyle = k % 2 ? '#3fbf6a' : '#2fa35a'; g.beginPath(); g.moveTo(-4, 1); g.lineTo(0, -8); g.lineTo(4, 1); g.closePath(); g.fill();
      g.restore();
    }
  }
  const img = FACES[ck];
  if (img && img.complete && img.naturalWidth) g.drawImage(img, -D / 2, hy, D, D);
  else {
    circle(0, hy + D / 2, D * 0.4, SKIN); g.fillStyle = '#231c1a'; g.beginPath(); g.arc(0, hy + D / 2 - 2, D * 0.42, Math.PI, 0); g.fill();
    circle(5, hy + D / 2 + 2, 1.6, INK); circle(-4, hy + D / 2 + 2, 1.6, INK);
  }
  if (st.form === 'tiger') { g.fillStyle = 'rgba(43,29,18,.55)'; for (const s of [-1, 1]) { g.fillRect(s * 20 - 1, hy + 30, 6 * s, 1.4); g.fillRect(s * 21 - 1, hy + 34, 5 * s, 1.4); } }
  g.restore();
  // 우유 보호막

    g.fillStyle = 'rgba(150,215,255,.16)'; g.strokeStyle = 'rgba(120,200,255,.85)'; g.lineWidth = 1.4;
    g.beginPath(); g.arc(0, -38, 44 + Math.sin(frame * 0.1), 0, TAU); g.fill(); g.stroke();
    ell(-17, -64, 7, 3.5, 'rgba(255,255,255,.6)', -0.6);
  }
  // 자석
  if (st.magnet) {
    g.save(); g.translate(0, -88 + Math.sin(frame * 0.12) * 1.5);
    g.strokeStyle = '#ff3b3b'; g.lineWidth = 3.5; g.lineCap = 'butt';
    g.beginPath(); g.arc(0, 0, 5, Math.PI, 0, true); g.stroke();
    g.fillStyle = '#e8e8f0'; g.fillRect(-6.75, -2.5, 3.5, 3); g.fillRect(3.25, -2.5, 3.5, 3);
    g.restore();
  }

  document.body.classList.remove('playing');
  const b = ov.querySelector('button'); if (b) b.focus({ preventScroll: true });
}
function hideOverlay() { ov.hidden = true; document.body.classList.add('playing'); canvas.focus && canvas.focus(); }

function showTitle() {
  S = 'title'; Music.stop();
  loadLevel(0); camX = 0; cpX = null;
  showOverlay(`
    <div class="stack">
      <h1 class="logo">진표와 진서의<span class="big">모<span>험</span></span></h1>
      <p class="lede">누구랑 모험을 떠날까? 골라서 눌러 봐!</p>
      <div class="row">
        ${['jinpyo', 'jinseo'].map(k => `
          <button class="pick${k === hero ? ' last' : ''}" data-act="${saved > 0 ? 'continue' : 'start'}" data-hero="${k}">
            <img class="${CHARS[k].photo ? 'photo' : ''}" src="${CHARS[k].photo ? CHARS[k].face : CHARS[k].full}" alt=""><span>${CHARS[k].name}</span>
          </button>`).join('')}
      </div>
      ${saved > 0 ? `<div class="keys">월드 ${saved + 1}부터 이어서 해요 · <button class="linkish" data-act="restart">처음부터 하기</button></div>` : ''}
      <button class="chip${easy ? '' : ' off'}" data-act="mode">${easy ? '쉬운 모드 켜짐 · 떨어져도 다시 올라와요' : '보통 모드 · 목숨 5개'}</button>
      ${document.body.classList.contains('touch')
        ? '<div class="keys">왼쪽 아래를 누르면 이동, 오른쪽 아래를 누르면 점프!</div>'
        : '<div class="keys"><kbd>←</kbd><kbd>→</kbd> 이동 &nbsp; <kbd>스페이스</kbd> 점프 &nbsp; <kbd>Shift</kbd> 달리기</div>'}
    </div>`, 'title');
}
function showIntro() {
  S = 'intro'; timer = 0; Music.stop();
  showOverlay(`
    <div class="card">
      <div class="eyebrow">월드 ${world + 1} / ${LEVELS.length}</div>
      <div class="name">${LEVELS[world].name}</div>
      <div class="meta"><img class="photo" src="${CHARS[hero].face}" alt="">${easy ? CHARS[hero].name + ' 출발!' : CHARS[hero].name + ' × ' + lives}</div>
    </div>`, 'dim');
}
function showPause() {
  prevS = S; S = 'paused'; if (AC) AC.suspend();
  showOverlay(`
    <div class="card">
      <div class="name">잠깐 쉬는 중</div>
      <p>물 한 잔 마시고 다시 달려볼까?</p>
      <div class="row">
        <button class="btn" data-act="resume">계속하기</button>
        <button class="btn ghost" data-act="home">처음 화면</button>
      </div>
    </div>`, 'dim');
}
function resume() {
  if (S !== 'paused') return;
  if (AC) AC.resume();
  S = prevS;
  if (S === 'intro') showIntro(); else hideOverlay();
  if (Music.song && AC) Music.next = AC.currentTime + 0.05;
}
function showOver() {
  showOverlay(`
    <div class="card">
      <h2>앗, 아쉬워!</h2>
      <p>괜찮아, ${CHARS[hero].name}${hero === 'jinpyo' ? '는' : '는'} 다시 할 수 있어. 이번엔 깃발까지 가 보자!</p>
      <div class="row">
        <button class="btn" data-act="retry">다시 도전</button>
        <button class="btn ghost" data-act="home">처음 화면</button>
      </div>
    </div>`, 'dim');
}
function showWin() {
  showOverlay(`
    <div class="card">
      <div class="eyebrow">모든 월드 클리어</div>
      <h2>축하해, 진표야 진서야!</h2>
      <p>아파트 단지, 놀이터, 도서관, 키즈카페를 지나 집까지 무사히 왔어. 둘 다 진짜 멋진 모험가야!</p>
      <div class="row">${['jinpyo', 'jinseo'].map(k => `<img class="duo${CHARS[k].photo ? ' photo' : ''}" src="${CHARS[k].photo ? CHARS[k].face : CHARS[k].full}" alt="">`).join('')}</div>
      <div class="meta">점수 ${String(score).padStart(6, '0')}</div>
      <div class="row"><button class="btn" data-act="home">처음부터 다시</button></div>
    </div>`, '');
}
function beginPlay() {
  if (S !== 'intro') return;
  S = 'play'; hideOverlay(); Music.start(THEMES[LEVELS[world].theme].song);
}
ov.addEventListener('pointerdown', () => { if (S === 'intro' && timer > 15) beginPlay(); });
function startGame(w) {
  if (S !== 'title') return;
  initAudio();
  lives = 5; score = 0; coins = 0; cpX = null;
  loadLevel(w); showIntro();
}
ov.addEventListener('click', e => {
  const b = e.target.closest('button[data-act]'); if (!b) return;
  initAudio(); sfx.click();
  const act = b.dataset.act;
  if (b.dataset.hero) {
    hero = b.dataset.hero;
    try { localStorage.setItem('jinpyo-hero', hero); } catch (e) {}
  }
  if (act === 'start') startGame(0);
  else if (act === 'continue') startGame(saved);
  else if (act === 'mode') { easy = !easy; try { localStorage.setItem('jinpyo-easy', easy ? '1' : '0'); } catch (e) {} showTitle(); }
  else if (act === 'restart') { saved = 0; try { localStorage.setItem('jinpyo-world', '0'); } catch (e) {} showTitle(); }
  else if (act === 'resume') resume();
  else if (act === 'home') { if (AC && AC.state === 'suspended') AC.resume(); showTitle(); }
  else if (act === 'retry') { lives = 5; loadLevel(world, true); showIntro(); }
});
$('btnPause').addEventListener('click', () => { if (S === 'play' || S === 'intro') showPause(); else if (S === 'paused') resume(); });
$('btnSound').addEventListener('click', () => { initAudio(); toggleMute(); });

/* ---------- Input ---------- */
const KB = { ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right', Space: 'jump', ArrowUp: 'jump', KeyW: 'jump', KeyZ: 'jump', ShiftLeft: 'run', ShiftRight: 'run', KeyX: 'run' };
window.addEventListener('keydown', e => {
  initAudio();
  const k = KB[e.code];
  if (S === 'title' && (e.code === 'Enter' || e.code === 'Space')) {
    if (ov.contains(document.activeElement) && document.activeElement.tagName === 'BUTTON') return; // 버튼 클릭이 처리
    e.preventDefault(); startGame(saved); return;
  }
  if (S === 'over' && e.code === 'Enter') { e.preventDefault(); lives = 5; loadLevel(world, true); showIntro(); return; }
  if (e.code === 'Escape' || e.code === 'KeyP') { if (S === 'play' || S === 'intro') showPause(); else if (S === 'paused') resume(); return; }
  if (S === 'paused' && e.code === 'Enter') { e.preventDefault(); resume(); return; }
  if (e.code === 'KeyM') { toggleMute(); return; }
  if (k) { kb[k] = true; e.preventDefault(); }
});
window.addEventListener('keyup', e => { const k = KB[e.code]; if (k) kb[k] = false; });
window.addEventListener('blur', () => { kb.left = kb.right = kb.jump = kb.run = false; });
document.addEventListener('visibilitychange', () => { if (document.hidden && (S === 'play')) showPause(); });

const dpad = $('dpad'), jumpBtn = $('jumpBtn'), zoneL = $('zoneL'), zoneR = $('zoneR');
const padPtrs = new Map(), jumpPtrs = new Set();
const buzz = () => { try { navigator.vibrate && navigator.vibrate(8); } catch (e) {} };
function dirFrom(e) {
  const a = dpad.children[1].getBoundingClientRect(), b = dpad.children[2].getBoundingClientRect();
  return e.clientX < (a.right + b.left) / 2 ? 'left' : 'right';
}
function syncPad() {
  const v = [...padPtrs.values()];
  tc.left = v.includes('left'); tc.right = v.includes('right');
  dpad.children[1].classList.toggle('on', tc.left); dpad.children[2].classList.toggle('on', tc.right);
}
function hinted() { document.body.classList.add('hinted'); }
zoneL.addEventListener('pointerdown', e => { e.preventDefault(); initAudio(); hinted(); try { zoneL.setPointerCapture(e.pointerId); } catch (_) {} padPtrs.set(e.pointerId, dirFrom(e)); syncPad(); buzz(); });
zoneL.addEventListener('pointermove', e => { if (padPtrs.has(e.pointerId)) { const d = dirFrom(e); if (d !== padPtrs.get(e.pointerId)) { padPtrs.set(e.pointerId, d); syncPad(); buzz(); } } });
['pointerup', 'pointercancel', 'lostpointercapture'].forEach(t => zoneL.addEventListener(t, e => { padPtrs.delete(e.pointerId); syncPad(); }));
function syncJump() { tc.jump = jumpPtrs.size > 0; jumpBtn.classList.toggle('on', tc.jump); }
zoneR.addEventListener('pointerdown', e => { e.preventDefault(); initAudio(); hinted(); try { zoneR.setPointerCapture(e.pointerId); } catch (_) {} jumpPtrs.add(e.pointerId); syncJump(); buzz(); });
['pointerup', 'pointercancel', 'lostpointercapture'].forEach(t => zoneR.addEventListener(t, e => { jumpPtrs.delete(e.pointerId); syncJump(); }));
function enableTouch() {
  if (document.body.classList.contains('touch')) return;
  document.body.classList.add('touch'); layout();
  if (S === 'title') showTitle();
}
if (window.matchMedia('(pointer: coarse)').matches || navigator.maxTouchPoints > 1) document.body.classList.add('touch');
window.addEventListener('touchstart', enableTouch, { once: true, passive: true });
let rotateDismissed = false;
$('rotateOk').addEventListener('click', () => { rotateDismissed = true; $('rotate').hidden = true; });
document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('dblclick', e => e.preventDefault());
document.addEventListener('contextmenu', e => e.preventDefault());

/* ---------- Layout ---------- */
function layout() {
  const r = app.getBoundingClientRect();
  const touch = document.body.classList.contains('touch');
  const w = Math.max(200, r.width - (touch ? 0 : 32)), h = Math.max(150, r.height - (touch ? 0 : 24));
  let ch = touch ? h : Math.min(h, w * 0.72);
  let cw = w;
  if (!touch && cw / ch * VH > 620) cw = ch * 620 / VH;
  if (touch && cw / ch * VH < 300) ch = Math.max(150, cw * VH / 300);
  $('rotate').hidden = !(touch && !rotateDismissed && window.innerHeight > window.innerWidth * 1.1);
  stage.style.width = Math.floor(cw) + 'px'; stage.style.height = Math.floor(ch) + 'px';
  const dpr = window.devicePixelRatio || 1;
  canvas.width = Math.round(cw * dpr); canvas.height = Math.round(ch * dpr);
  VIEWH = touch ? VH + 58 : VH;
  scale = canvas.height / VIEWH;
  bw = canvas.width / scale;
  if (L && P && S !== 'title') camX = clamp(camX, 0, L.w * T - bw);
}
window.addEventListener('resize', layout);

/* ---------- Loop ---------- */
let last = performance.now(), acc = 0;
function loop(now) {
  requestAnimationFrame(loop);
  acc += Math.min(0.1, (now - last) / 1000); last = now;
  while (acc >= 1 / 60) { step(); acc -= 1 / 60; }
  render();
}

function boot(data) {
  layout();
  if (data && data.inGame && typeof data.world === 'number' && LEVELS[data.world]) {
    lives = data.lives || 5; score = data.score || 0; coins = data.coins || 0; cpX = data.cpX ?? null;
    loadLevel(data.world, true); showIntro();
  } else showTitle();
  requestAnimationFrame(t => { last = t; loop(t); });
}
try { window.claude?.hot?.snapshot?.(() => ({ inGame: !['title', 'win', 'over'].includes(S), world, lives, score, coins, cpX })); } catch (e) {}
const hot = window.claude?.hot;
if (hot?.ready) hot.ready(boot); else boot(hot?.data ?? {});
})();
</script>

</body>
</html>
